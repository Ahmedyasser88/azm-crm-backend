name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AzmCrm.sln

      - name: Build
        run: dotnet build AzmCrm.sln --no-restore --configuration Release

      - name: Test - Application
        run: dotnet test tests/AzmCrm.Application.Tests/AzmCrm.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Test - Infrastructure
        run: dotnet test tests/AzmCrm.Infrastructure.Tests/AzmCrm.Infrastructure.Tests.csproj --no-build --configuration Release --verbosity normal
